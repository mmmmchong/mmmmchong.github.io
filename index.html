<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人学术主页：研究兴趣、学术论文与博客。">
  <title>Academic homepage · Home</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳转到内容</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span data-profile="name"></span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">菜单 <span aria-hidden="true">☰</span></button>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a href="index.html" aria-current="page">Home</a><a href="publications.html">Publication</a><a href="blog.html">Blog</a>
      </nav>
    </div>
  </header>
  <main class="wrap home-layout" id="main" tabindex="-1">
    <aside class="profile-aside" aria-label="个人资料">
      <div class="avatar" data-avatar><span data-profile="initials" aria-hidden="true"></span></div>
      <h1 class="aside-name" data-profile="fullName"></h1>
      <p class="aside-role" data-profile="role">职位 / 身份</p>
      <div class="affiliation"><div data-profile="department">院系 / 研究组</div><div class="institution"><svg class="contact-icon" width="13" height="16" viewBox="0 0 16 20" fill="none" aria-hidden="true"><path d="m1 7 7-4 7 4-7 4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4 9v4c2 2 6 2 8 0V9M15 7v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span data-profile="institution">学校 / 机构</span></div></div>
      <p class="location"><svg class="contact-icon" width="13" height="16" viewBox="0 0 16 20" fill="none" aria-hidden="true"><path d="M14 8c0 5-6 10-6 10S2 13 2 8a6 6 0 1 1 12 0Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg><span data-profile="location">城市，国家</span></p>
      <div class="profile-links" data-profile-links><p class="muted-note">联系方式待补充</p></div>
    </aside>
    <div class="home-content">
      <section class="hero" aria-label="个人简介">
        <p class="intro" data-profile="intro" lang="en"></p>
        <ul class="interest-list" data-interests aria-label="研究兴趣"></ul>
      </section>
      <section class="education" aria-labelledby="education-title" lang="en" hidden>
        <h2 id="education-title">Education</h2>
        <ul class="education-list" data-education></ul>
      </section>
    </div>
  </main>
  <noscript><p>开启 JavaScript 后可查看完整个人资料、论文和文章。你仍可使用上方导航浏览各页面。</p></noscript>
  <footer class="site-footer"><div class="wrap footer-inner"><p>© <span data-year>2026</span> <span data-profile="name"></span></p><p class="footer-note">Research, writing, and a little curiosity.</p></div></footer>
</body>
</html>
